<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пивасик</title>

<style>
    body{
        margin:0;
        overflow:hidden;
        background:#1e1e1e;
        font-family:Arial;
    }

    h1{
        text-align:center;
        color:white;
        margin-top:40px;
        font-size:40px;
    }

    #yes{
        position:absolute;
        padding:20px 40px;
        font-size:30px;
        border:none;
        border-radius:15px;
        background:lime;
        color:black;
        font-weight:bold;
        cursor:pointer;
        left:40%;
        top:40%;
    }

    #no{
        position:absolute;
        bottom:100px;
        left:50%;
        transform:translateX(-50%);
        padding:20px 40px;
        font-size:30px;
        border:none;
        border-radius:15px;
        background:red;
        color:white;
        cursor:pointer;
    }
</style>
</head>

<body>

<h1>Хочеш пиво завтра?</h1>

<button id="yes">ДА</button>
<button id="no">НЕТ</button>

<script>

const yes = document.getElementById("yes");

function moveButton(){
    const maxX = window.innerWidth - yes.offsetWidth;
    const maxY = window.innerHeight - yes.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    yes.style.left = randomX + "px";
    yes.style.top = randomY + "px";
}

yes.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

yes.addEventListener("mouseover", moveButton);

document.getElementById("no").onclick = function(){
    document.body.innerHTML = `
    <div style="
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:black;
        color:white;
        font-size:50px;
        font-family:Arial;
        text-align:center;
    ">
        Это значит хорошо, еще не доросла 😎
    </div>
    `;
};

</script>

</body>
</html>
